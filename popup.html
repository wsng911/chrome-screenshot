<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一键全页截图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 240px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #333;
    }

    .header {
      background: linear-gradient(135deg, #1976D2, #42A5F5);
      color: white;
      padding: 16px;
      text-align: center;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .header p {
      font-size: 11px;
      opacity: 0.85;
      margin-top: 3px;
    }

    .body {
      padding: 16px;
    }

    .btn-capture {
      width: 100%;
      padding: 12px;
      background: #1976D2;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-capture:hover { background: #1565C0; }
    .btn-capture:active { transform: scale(0.97); }
    .btn-capture:disabled {
      background: #90CAF9;
      cursor: not-allowed;
      transform: none;
    }

    .btn-capture svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .shortcut {
      text-align: center;
      margin-top: 10px;
      font-size: 11px;
      color: #999;
    }

    .shortcut kbd {
      background: #f0f0f0;
      border: 1px solid #ccc;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 10px;
      font-family: inherit;
    }

    .status {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      display: none;
    }

    .status.progress {
      background: #E3F2FD;
      color: #1565C0;
      display: block;
    }

    .status.success {
      background: #E8F5E9;
      color: #2E7D32;
      display: block;
    }

    .status.error {
      background: #FFEBEE;
      color: #C62828;
      display: block;
    }

    .footer {
      padding: 10px 16px;
      border-top: 1px solid #f0f0f0;
      font-size: 10px;
      color: #bbb;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>📸 一键全页截图</h1>
  <p>自动截取完整网页并保存</p>
</div>

<div class="body">
  <button class="btn-capture" id="btnCapture">
    <svg viewBox="0 0 24 24">
      <path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.65 0-3 1.35-3 3s1.35 3 3 3 3-1.35 3-3-1.35-3-3-3z"/>
    </svg>
    截取整个页面
  </button>

  <div class="shortcut">
    快捷键：<kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd>
  </div>

  <div class="status" id="status"></div>
</div>

<div class="footer">截图自动保存到下载文件夹</div>

<script src="popup.js"></script>
</body>
</html>
